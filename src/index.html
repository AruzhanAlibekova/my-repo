<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SoftBloom</h1>
    <nav>
      <ul>

  <section id="flowers">

    <div class="gallery">
      <img src="images/peonies.jpg" alt="Розовые пионы">
      <img src="images/roses.jpg" alt="Розовые розы">

  <section id="quote">
    <blockquote>“Цветы — это улыбка природы для души.”</blockquote>
  </section>

  <section id="contact">
    <h2>Контакты</h2>
    <p>Адрес: Бейбитшилик 39</p>
  </section>

  <footer>
    <p>&copy; 2025 SoftBloom</p>
